<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Gobble Getaway — a turkey escapes the farmer across the barnyard, the cornfield and the kitchen before Thanksgiving dinner.">
<title>Gobble Getaway — The Great Thanksgiving Escape</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241408; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; background: #e76f51; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Gobble Getaway: a turkey escapes the farmer. Jump with Space, duck and hide with Down, dash with Shift"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
